<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Snake - DQN with Value Loss</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.15.1/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🐍 AI Snake - DQN с Value Loss</h1>

        <div class="stats">
            <div class="stat-item">
                <span>Поколение</span>
                <span id="generation">0</span>
            </div>
            <div class="stat-item">
                <span>Счет</span>
                <span id="score">0</span>
            </div>
            <div class="stat-item">
                <span>Лучший</span>
                <span id="best-score">0</span>
            </div>
            <div class="stat-item">
                <span>Шаги</span>
                <span id="steps">0</span>
            </div>
            <div class="stat-item">
                <span>Epsilon</span>
                <span id="epsilon">1.00</span>
            </div>
            <div class="stat-item">
                <span>Ср. счет</span>
                <span id="avg-score">0.0</span>
            </div>
        </div>

        <div class="game-area">
            <div class="game-left">
                <canvas id="gameCanvas" width="360" height="360"></canvas>

                <div class="controls">
                    <button id="startBtn" onclick="startTraining()">▶ Начать</button>
                    <button id="pauseBtn" onclick="togglePause()">⏸ Пауза</button>
                    <button id="resetBtn" onclick="resetGame()">🔄 Сброс</button>
                    <button id="speedBtn" onclick="toggleSpeed()">⚡ 1x</button>
                </div>
            </div>

            <div class="game-right">
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="lossChart"></canvas>
                </div>
            </div>
        </div>

        <div class="info">
            <p>🎯 DQN + Value Loss | Поле 12x12</p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
